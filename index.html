<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
</head>

<body>


    <header class="bg-primary">
        <div class="container d-flex justify-content-between align-items-center">
            <nav class="navbar navbar-expand-md bg-primary container-fluid" data-bs-theme="dark">
                <div class="container-fluid">
                    <a class="navbar-brand text-light fw-bold" href="#">EdiShop</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
                        <div class="navbar-nav">
                            <a class="nav-link" href="#prodotti">Prodotti</a>
                            <a class="nav-link" href="#">Offerte</a>
                            <a class="nav-link" href="#">Contatti</a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>


    <section class="hero">
        <div class="container-fluid text-center p-0">
            <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <!-- creo il carousel con js -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
    </section>

    <main class="container my-4">
        <div class="alert alert-info alert-dismissible">Spedizione gratis sopra i 50 €.
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">

            <aside class="col-lg-3 d-none d-lg-block">
                <div class="bg-light p-3 rounded border">
                    <h3 class="fs-5 fw-bold mb-3">Categorie</h3>
                    <p class="m-0 mb-2"> Scarpe </p>
                    <p class="m-0 mb-2"> T-shirt </p>
                    <p class="m-0 mb-2"> Borse </p>
                    <p class="m-0 mb-2"> Accessori </p>
                </div>
            </aside>

            <section class="col-12 col-lg-9">
                <h2 id="prodotti" class="fs-3 fw-bold mb-4 text-center text-md-start"> Prodotti in evidenza
                    <span class="badge text-bg-danger">-30%</span>
                </h2>

                <div class="row g-3 px-3" id="productsRow">
                    <!-- creo card e bottone in javascript-->

                    <!-- Modal -->
                    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                        aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5 fw-semibold" id="exampleModalLabel">
                                        Sneaker
                                        Run</h1>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <img src="https://placehold.jp/600x300.png" class="img-fluid mb-3" alt="...">
                                    <p class="card-text text-dark">Scarpa leggera per la corsa, suola in gomma
                                        traspirante. Disponibile dal 36 al 46.
                                    </p>
                                    <h5 class="fw-bold m-0">€ 89,00</h5>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Chiudi</button>
                                    <button type="button" class="btn btn-success">Aggiungi al
                                        carrello
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
        </div>
        </article>


        </div>

        </section>
        </div>

    </main>

    <footer class="bg-dark text-white py-3">
        <div class="container text-center">
            <p class="fs-6 mb-0"> © 2026 EdiShop — tutti i diritti riservati</p>
        </div>
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
</body>

</html>
